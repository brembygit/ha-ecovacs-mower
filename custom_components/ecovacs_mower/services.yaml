mow_area:
  target:
    entity:
      domain: lawn_mower
      integration: ecovacs_mower
  fields:
    area_ids:
      required: true
      example: "[1, 3]"
      selector:
        text:
          multiple: true
          type: number

clean_rooms:
  target:
    entity:
      domain: vacuum
      integration: ecovacs_mower
  fields:
    rooms:
      required: true
      example: '["Kitchen", "Hall"]'
      selector:
        text:
          multiple: true
